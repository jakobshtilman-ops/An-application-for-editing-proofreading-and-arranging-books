  <path d="M176 124 C176 220 236 240 256 256 C276 240 336 220 336 124 Z" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M176 388 C176 292 236 272 256 256 C276 272 336 292 336 388 Z" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <!-- Flowing Sand -->
