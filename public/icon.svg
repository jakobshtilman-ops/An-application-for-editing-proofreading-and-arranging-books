<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sand-grad" x1="256" y1="140" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
