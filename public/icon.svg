  <path d="M220 376 Q256 320 292 376 Z" fill="url(#sand-grad)"/>
  <circle cx="256" cy="275" r="4" fill="#38bdf8"/>
  <circle cx="256" cy="300" r="5" fill="#38bdf8"/>
