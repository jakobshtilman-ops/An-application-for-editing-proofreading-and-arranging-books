name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build PWA for GitHub Pages
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Upload production ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: typing-system-production-app
          path: ./dist
          retention-days: 90

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  build-windows-exe:
    name: Build Windows EXE Application
    needs: deploy
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download prebuilt Web Assets
        uses: actions/download-artifact@v4
        with:
          name: typing-system-production-app
          path: dist

      - name: Install packaging dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows EXE Installer & Portable EXE
        run: npx electron-builder --win nsis portable

      - name: Upload Windows EXE Installers
        uses: actions/upload-artifact@v4
        with:
          name: TypingSystem-Windows-EXE
          path: release/*.exe
          retention-days: 90
