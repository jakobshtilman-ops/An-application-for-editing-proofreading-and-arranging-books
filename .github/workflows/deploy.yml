name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Application, Windows EXE & MSI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          npm install --legacy-peer-deps --include=optional
          npm install --no-save --legacy-peer-deps lightningcss-win32-x64-msvc @rolldown/binding-win32-x64-msvc @rollup/rollup-win32-x64-msvc

      - name: Build Web Application
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          New-Item -ItemType File -Force -Path dist\.nojekyll

      - name: Build Tauri EXE & MSI
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows MSI & EXE Installers
        uses: actions/upload-artifact@v4
        with:
          name: TypingSystem-Windows-MSI-and-EXE
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

